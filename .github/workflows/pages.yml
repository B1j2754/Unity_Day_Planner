# Deploys the repo root to GitHub Pages. There is no build step: the site is
# plain HTML, ES modules and the committed vendor/ libraries.
#
# ONE-TIME SETUP, REQUIRED BEFORE THE FIRST RUN:
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"
#
# Without it, configure-pages below fails with "Get Pages site failed ...
# Not Found". That cannot be automated here: the action's `enablement: true`
# option needs administration:write, which the built-in GITHUB_TOKEN is not
# allowed to have, so it would need a personal access token. Clicking the
# setting once is less machinery than maintaining a PAT.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
